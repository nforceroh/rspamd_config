multimap_whitelist_domain {
  type = "from";
  filter = "email:domain";
  map = "https://raw.githubusercontent.com/nforceroh/rspamd_config/main/maps.d/whitelist.domain.map";
  score = -50.0;
  symbol = "multimap_whitelist_domain";
  description = "Domain whitelist";
  regexp = true;
  one_shot = true;
  # THE SHIELD: The -50.0 score is ONLY allowed if the sender passes 
  # public crypto verification OR originates from your trusted local network.
  require_symbols = "R_SPF_ALLOW | R_DKIM_ALLOW | is_local";
}
